<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Method Overview</title>
  <desc id="desc">A workflow diagram showing pretrained LLM plus OmniQuant initialization, hard-round quantized forward, downstream task loss, surrogate-gradient backward, and update quantization scale corrections, with a feedback loop back to quantized forward.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#c8bff2" flood-opacity="0.6"/>
    </filter>
    <style>
      .box { fill:#f5f1ff; stroke:#ad99f5; stroke-width:2; rx:8; ry:8; filter:url(#shadow); }
      .label { font-family: Arial, Helvetica, sans-serif; font-size:16px; fill:#1f1f1f; font-weight:500; }
      .line { stroke:#555555; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <!-- boxes -->
  <rect class="box" x="35" y="110" width="175" height="90" />
  <rect class="box" x="255" y="110" width="175" height="90" />
  <rect class="box" x="475" y="110" width="160" height="90" />
  <rect class="box" x="680" y="95" width="175" height="120" />
  <rect class="box" x="900" y="110" width="170" height="90" />

  <!-- arrows -->
  <line class="line" x1="210" y1="155" x2="248" y2="155" />
  <line class="line" x1="430" y1="155" x2="468" y2="155" />
  <line class="line" x1="635" y1="155" x2="673" y2="155" />
  <line class="line" x1="855" y1="155" x2="893" y2="155" />
  <path class="line" d="M 985 200 C 985 255, 520 255, 343 255 C 300 255, 300 225, 300 206" />

  <!-- text -->
  <text class="label" x="122.5" y="140" text-anchor="middle">
    <tspan x="122.5" dy="0">Pretrained LLM</tspan>
    <tspan x="122.5" dy="25">+ OmniQuant</tspan>
    <tspan x="122.5" dy="25">initialization</tspan>
  </text>

  <text class="label" x="342.5" y="140" text-anchor="middle">
    <tspan x="342.5" dy="0">Hard-round</tspan>
    <tspan x="342.5" dy="25">quantized</tspan>
    <tspan x="342.5" dy="25">forward</tspan>
  </text>

  <text class="label" x="555" y="142" text-anchor="middle">
    <tspan x="555" dy="0">Downstream</tspan>
    <tspan x="555" dy="25">task loss</tspan>
  </text>

  <text class="label" x="767.5" y="125" text-anchor="middle">
    <tspan x="767.5" dy="0">Surrogate-</tspan>
    <tspan x="767.5" dy="25">gradient</tspan>
    <tspan x="767.5" dy="25">backward</tspan>
    <tspan x="767.5" dy="25">STE / HTGE /</tspan>
    <tspan x="767.5" dy="25">Uniform /</tspan>
    <tspan x="767.5" dy="25">Normal</tspan>
  </text>

  <text class="label" x="985" y="140" text-anchor="middle">
    <tspan x="985" dy="0">Update</tspan>
    <tspan x="985" dy="25">quantization</tspan>
    <tspan x="985" dy="25">scale</tspan>
    <tspan x="985" dy="25">corrections</tspan>
  </text>
</svg>
